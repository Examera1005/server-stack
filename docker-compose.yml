services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    environment:
      - ND_SCANSCHEDULE=1m
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_MUSICFOLDER=/music
      - ND_DATAFOLDER=/data
      - ND_ENABLEDOWNLOADS=true
      - ND_ENABLESTARSHARING=true
      - ND_ENABLEFAVOURITES=true
    volumes:
      - ./config/navidrome:/data
      - ${MUSIC_DIR:-./music}:/music:rw
    restart: unless-stopped

  streamvault:
    build: ./web_app
    container_name: streamvault
    ports:
      - "${STREAMVAULT_PORT:-4535}:4535"
    environment:
      - MUSIC_DIR=/music
      - DEEMIX_CONFIG_DIR=/root/.config/deemix
      - NAVIDROME_CONTAINER=navidrome
      - NAVIDROME_PORT=${NAVIDROME_PORT:-4533}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MUSIC_DIR:-./music}:/music:rw
      - ./config/deemix:/root/.config/deemix
      - ./config/streamvault:/data
    restart: unless-stopped
