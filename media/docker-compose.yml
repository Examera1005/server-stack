version: "3.8"

# ==============================================================================
# MEDIA STACK - Jellyfin, qBittorrent, Sonarr, Radarr, Bazarr, Prowlarr, FlareSolverr
# ==============================================================================
# USER CONFIGURATION NOTES:
# 1. PUID/PGID: Run 'id' on host to get your User ID and Group ID (default: 1000).
# 2. STORAGE PATHS: Adjust '/mnt/hdd/media' to match your host media storage path.
# 3. GPU TRANSCODING: Jellyfin has hardware acceleration mapped via '/dev/dri:/dev/dri'
#    (Intel QuickSync / VAAPI). Comment out lines 21-22 if you don't use hardware GPU acceleration.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Jellyfin - Media Streaming Server
  # ----------------------------------------------------------------------------
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Auto}
    volumes:
      - ./config/jellyfin:/config
      # --- CHANGE HOST PATH BELOW TO YOUR MEDIA LIBRARY ---
      - /mnt/hdd/media/library:/media
    devices:
      # --- OPTIONAL: Uncomment device mapping below for Intel/AMD iGPU Hardware Transcoding ---
      - /dev/dri:/dev/dri
    ports:
      - 8096:8096
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.25'
          memory: 1500M

  # ----------------------------------------------------------------------------
  # qBittorrent - Torrent Client & Downloader
  # ----------------------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Auto}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./config/qbittorrent:/config
      # --- CHANGE HOST PATH BELOW TO YOUR DOWNLOADS / MEDIA DIRECTORY ---
      - /mnt/hdd/media:/data
    ports:
      - 8085:8080       # WebUI accessible on http://HOST_IP:8085
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # ----------------------------------------------------------------------------
  # Prowlarr - Indexer Proxy & Manager (Sonarr/Radarr Integration)
  # ----------------------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Auto}
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 384M

  # ----------------------------------------------------------------------------
  # Sonarr - TV Shows Automation & Download Manager
  # ----------------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Auto}
    volumes:
      - ./config/sonarr:/config
      # --- CHANGE HOST PATH BELOW TO YOUR MEDIA ROOT DIRECTORY ---
      - /mnt/hdd/media:/data
    ports:
      - 8989:8989
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 512M

  # ----------------------------------------------------------------------------
  # Radarr - Movies Automation & Download Manager
  # ----------------------------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Auto}
    volumes:
      - ./config/radarr:/config
      # --- CHANGE HOST PATH BELOW TO YOUR MEDIA ROOT DIRECTORY ---
      - /mnt/hdd/media:/data
    ports:
      - 7878:7878
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 512M

  # ----------------------------------------------------------------------------
  # Bazarr - Automatic Subtitle Downloader
  # ----------------------------------------------------------------------------
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Auto}
    volumes:
      - ./config/bazarr:/config
      # --- CHANGE HOST PATH BELOW TO YOUR MEDIA ROOT DIRECTORY ---
      - /mnt/hdd/media:/data
    ports:
      - 6767:6767
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 384M

  # ----------------------------------------------------------------------------
  # FlareSolverr - Cloudflare Challenge Solver Proxy for Prowlarr
  # ----------------------------------------------------------------------------
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ:-Auto}
    ports:
      - 8191:8191
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
