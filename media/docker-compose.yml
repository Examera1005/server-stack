version: "3.8"

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Auto
    volumes:
      - ./config/jellyfin:/config
      - /mnt/hdd/media/library:/media
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 8096:8096
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.25'
          memory: 1500M

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Auto
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./config/qbittorrent:/config
      - /mnt/hdd/media:/data
    ports:
      - 8085:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Auto
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 384M

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Auto
    volumes:
      - ./config/sonarr:/config
      - /mnt/hdd/media:/data
    ports:
      - 8989:8989
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 512M

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Auto
    volumes:
      - ./config/radarr:/config
      - /mnt/hdd/media:/data
    ports:
      - 7878:7878
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 512M

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Auto
    volumes:
      - ./config/bazarr:/config
      - /mnt/hdd/media:/data
    ports:
      - 6767:6767
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 384M

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=Auto
    ports:
      - 8191:8191
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
